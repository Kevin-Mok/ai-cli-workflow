fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# [mcp_servers.memora]
# command = "memora-server"
# args = ["--no-graph"]

[mcp_servers.graphiti]
command = "uv"
args = [
  "run",
  "main.py",
  "--transport",
  "stdio",
  "--database-provider",
  "neo4j",
  "--model",
  "qwen3:14b",
]
cwd = "/home/example/coding/graphiti/mcp_server"
startup_timeout_sec = 120
tool_timeout_sec = 120

[tui]
notifications = true
notification_method = "osc9"
status_line = ["model-with-reasoning", "five-hour-limit", "current-dir", "weekly-limit", "total-input-tokens", "total-output-tokens", "git-branch", "context-remaining", "used-tokens", "context-window-size"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
