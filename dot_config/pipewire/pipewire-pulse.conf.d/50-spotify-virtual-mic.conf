# Keep the cable monitor available by its established name for Discord capture.
pulse.cmd = [
    { cmd = "load-module"
      args = "module-null-sink sink_name=spotify_cable sink_properties='device.description=\"Spotify Cable\"' rate=48000 channels=2 channel_map=front-left,front-right"
      flags = [ nofail ] }
    { cmd = "load-module"
      args = "module-remap-source master=spotify_cable.monitor source_name=spotify_virtual_mic source_properties='device.description=\"Spotify Virtual Mic\"' rate=48000 channels=2 channel_map=front-left,front-right master_channel_map=front-left,front-right remix=no"
      flags = [ nofail ] }
]
