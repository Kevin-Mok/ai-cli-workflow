confirm_os_window_close 0

allow_remote_control socket-only
listen_on unix:/tmp/kitty

include ~/.cache/wal/colors-kitty.conf
background_opacity 0.9
clipboard_control write-clipboard write-primary
enable_audio_bell no

# Long Codex output: a slim, rounded scrollbar with a larger hover target.
scrollback_lines 50000
scrollbar always
scrollbar_interactive yes
scrollbar_width 0.6
scrollbar_hover_width 1.2
scrollbar_radius 0.3
scrollbar_min_handle_height 2
scrollbar_hitbox_expansion 0.4
scrollbar_handle_opacity 0.7
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0.1

map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+end scroll_end
# Ctrl+A includes offscreen history; the adapter selects tmux history when active.
map ctrl+a kitten tmux_copy.py select-all
# Ctrl+Shift+C copies released tmux highlights as well as native Kitty selections.
map --allow-fallback=shifted,ascii ctrl+shift+c kitten tmux_copy.py


# font
cursor_blink_interval 0
# font_size 12.5
font_size 12
map ctrl+alt+up change_font_size all +1.0
map ctrl+alt+down change_font_size all -1.0
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold

# Map PUA ranges to the Symbols Nerd Font (or your main Nerd Font)
# The Firefox icon (U+E2E9) is often in the Pomicons or Devicons range
symbol_map U+E000-U+EFFF Hack Nerd Font Mono
symbol_map U+F000-U+FFFF Hack Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2B58,U+2EFE-U+3000 Hack Nerd Font Mono
# You can also use the symbols-only font if you have it installed:
# symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
