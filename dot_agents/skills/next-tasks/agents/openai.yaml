interface:
  display_name: "Next Tasks"
  short_description: "List up to 5 self-verifiable tasks, then do the one I pick"
  default_prompt: "Use $next-tasks to read recent commits, TODO/FIXME comments, and open issues, list up to 5 tasks you can finish and verify on your own with how you'd prove each, then wait for me to pick one."
policy:
  allow_implicit_invocation: false
