interface:
  display_name: "Next Tasks"
  short_description: "List up to 5 self-verifiable tasks, then do the one I pick"
  default_prompt: "Use $next-tasks to infer work from recent git history, repo docs, prompt docs, and recent Codex sessions in this repo, list up to 5 evidence-cited tasks you can finish and verify on your own with how you'd prove each, then wait for me to pick one."
policy:
  allow_implicit_invocation: false
