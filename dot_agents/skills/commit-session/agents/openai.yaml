interface:
  display_name: "Commit Session"
  short_description: "Commit and push only current-session git work"
  default_prompt: "Use $commit-session to commit only the git changes dirtied during the current Codex session while leaving unrelated baseline-dirty files untouched. Single-commit workflows push after the commit passes verification; multi-commit workflows push once after the complete verified series, unless the user explicitly requests another cadence."

policy:
  allow_implicit_invocation: false
